name: Real clinic PostgreSQL 18 gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/real-clinic-safety
  push:
    branches:
      - codex/real-clinic-safety

permissions:
  contents: read

jobs:
  postgres-gate:
    name: PostgreSQL 18 migration and integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightingale_ci
          POSTGRES_PASSWORD: nightingale_ci_password
          POSTGRES_DB: nightingale_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightingale_ci -d nightingale_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://nightingale_ci:nightingale_ci_password@127.0.0.1:5432/nightingale_ci
      DEMO_SEED_PASSWORD: synthetic-ci-seed-password
      SESSION_SECRET: synthetic-ci-session-secret-at-least-32-chars
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      LLM_PROVIDER: fixture
      VOICE_PROVIDER: disabled

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --requirement backend/requirements.lock

      - name: Upgrade fresh database through 0015
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check Alembic metadata drift
        working-directory: backend
        run: python -m alembic check

      - name: Exercise disposable PostgreSQL downgrade and re-upgrade
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic downgrade 0014_patient_publications
          python -m alembic upgrade head
          python -m alembic check

      - name: Assert PostgreSQL tables, indexes, and foreign keys
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              inspector = inspect(engine)
              expected_tables = {
                  "clinics",
                  "users",
                  "clinic_memberships",
                  "patients",
                  "patient_user_links",
                  "entries",
                  "entry_versions",
                  "audit_logs",
                  "conflicts",
                  "comments",
                  "highlights",
                  "ai_processing_jobs",
                  "patient_glance_items",
                  "highlight_feedback_events",
                  "importance_profiles",
                  "archival_summaries",
                  "archival_summary_sources",
                  "mentions",
                  "tasks",
                  "task_conflicts",
                  "task_glance_items",
                  "collaboration_events",
                  "voice_sessions",
                  "transcript_segments",
                  "clinical_assertions",
                  "clinical_conflicts",
                  "glance_impression_batches",
                  "glance_impression_items",
                  "ai_provider_circuits",
                  "patient_publications",
                  "patient_publication_versions",
                  "patient_publication_evidence",
              }
              actual_tables = set(inspector.get_table_names())
              assert not expected_tables - actual_tables, sorted(expected_tables - actual_tables)

              publication_columns = {
                  column["name"] for column in inspector.get_columns("patient_publications")
              }
              assert {
                  "source_entry_id",
                  "source_version_id",
                  "state",
                  "content_version",
                  "workflow_version",
                  "correction_of_publication_id",
                  "superseded_by_publication_id",
              } <= publication_columns
              evidence_columns = {
                  column["name"]
                  for column in inspector.get_columns("patient_publication_evidence")
              }
              assert {
                  "publication_version_id",
                  "source_version_id",
                  "start_offset",
                  "end_offset",
                  "quote_sha256",
                  "validation_status",
              } <= evidence_columns
              publication_fks = inspector.get_foreign_keys("patient_publications")
              referenced = {
                  (tuple(fk["constrained_columns"]), fk["referred_table"])
                  for fk in publication_fks
              }
              assert (("source_entry_id",), "entries") in referenced
              assert (("source_version_id",), "entry_versions") in referenced
              assert (("correction_of_publication_id",), "patient_publications") in referenced
              assert (("superseded_by_publication_id",), "patient_publications") in referenced
              feedback_column = next(
                  column
                  for column in inspector.get_columns("highlight_feedback_events")
                  if column["name"] == "applied_to_profile"
              )
              assert feedback_column["nullable"] is False
              assert "true" in str(feedback_column["default"]).lower()
              version_column = next(
                  column
                  for column in inspector.get_columns("alembic_version")
                  if column["name"] == "version_num"
              )
              assert (version_column["type"].length or 0) >= 64
              with engine.connect() as connection:
                  assert (
                      connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
                      == "0015_feedback_backward_compat"
                  )
          finally:
              engine.dispose()
          PY

      - name: Run synthetic seed twice and compare safe counts
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/nightingale-seed-first.json"
          second="${RUNNER_TEMP}/nightingale-seed-second.json"
          python -m app.scripts.seed_demo > "${first}"
          python -m app.scripts.seed_demo > "${second}"
          python - "${first}" "${second}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as first_file:
              first = json.load(first_file)
          with open(sys.argv[2], encoding="utf-8") as second_file:
              second = json.load(second_file)
          assert first["counts"] == second["counts"]
          assert first["counts"]["patient_publications"] >= 1
          assert first["counts"]["patient_publication_versions"] >= 1
          assert first["counts"]["patient_publication_evidence"] >= 1
          PY

      - name: Probe pinned bridge application against 0015 compatibility schema
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/tags/real-clinic-bridge1:refs/tags/real-clinic-bridge1
          test "$(git rev-parse refs/tags/real-clinic-bridge1^{commit})" = "a6fc8c087a55808db1c363336fa5897abb2a0346"
          baseline_root="${RUNNER_TEMP}/nightingale-baseline"
          mkdir -p "${baseline_root}"
          git archive refs/tags/real-clinic-bridge1 | tar -x -C "${baseline_root}"
          (cd "${baseline_root}" && python -m app.scripts.round7_bridge_smoke)

      - name: Run backend regression and Round 1-4 safety suites
        working-directory: backend
        run: python -m pytest

      - name: Run backend static quality gates
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check app tests
          python -m ruff format --check app tests
          python -m mypy app tests
          python -m pip check
