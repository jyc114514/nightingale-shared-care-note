name: Compatibility bridge PostgreSQL 18 gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/real-clinic-compat-bridge

permissions:
  contents: read

jobs:
  compatibility-bridge:
    name: Baseline behavior on the 0015 bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightingale_ci
          POSTGRES_PASSWORD: nightingale_ci_password
          POSTGRES_DB: nightingale_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightingale_ci -d nightingale_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://nightingale_ci:nightingale_ci_password@127.0.0.1:5432/nightingale_ci
      DEMO_SEED_PASSWORD: synthetic-ci-seed-password
      SESSION_SECRET: synthetic-ci-session-secret-at-least-32-chars
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      LLM_PROVIDER: fixture
      VOICE_PROVIDER: disabled

    steps:
      - name: Check out bridge source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --requirement backend/requirements.lock

      - name: Upgrade bridge database through 0015
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Assert bridge ledger and feedback default
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              inspector = inspect(engine)
              feedback_column = next(
                  column
                  for column in inspector.get_columns("highlight_feedback_events")
                  if column["name"] == "applied_to_profile"
              )
              assert feedback_column["nullable"] is False
              assert "true" in str(feedback_column["default"]).lower()
              with engine.connect() as connection:
                  assert (
                      connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
                      == "0015_feedback_backward_compat"
                  )
          finally:
              engine.dispose()
          PY

      - name: Run baseline synthetic seed twice
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/bridge-seed-first.json"
          second="${RUNNER_TEMP}/bridge-seed-second.json"
          python -m app.scripts.seed_demo > "${first}"
          python -m app.scripts.seed_demo > "${second}"
          python - "${first}" "${second}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as first_file:
              first = json.load(first_file)
          with open(sys.argv[2], encoding="utf-8") as second_file:
              second = json.load(second_file)
          assert first["counts"] == second["counts"]
          assert first["counts"]["highlights"] >= 5
          assert first["counts"]["glance_items"] == first["counts"]["highlights"]
          PY

      - name: Exercise the bridge entrypoint
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && PORT=8010 DEMO_SEED_ENABLED=false ../scripts/render_entrypoint.sh) > "${RUNNER_TEMP}/bridge-entrypoint.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/health > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "bridge entrypoint did not become healthy" >&2
          exit 1

      - name: Exercise baseline login Glance source comments and feedback
        working-directory: backend
        run: python -m app.scripts.round7_bridge_smoke

      - name: Run baseline backend regression suite
        working-directory: backend
        run: python -m pytest --ignore=tests/test_migrations.py

      - name: Run bridge static checks
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check app tests
          python -m ruff format --check app tests
          python -m mypy app tests
          python -m pip check

      - name: Build bridge Docker image without pushing
        run: docker build --tag nightingale-compat-bridge:${GITHUB_SHA} .
