name: Real clinic deploy-branch PostgreSQL 18 gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/real-clinic-deploy

permissions:
  contents: read

jobs:
  deploy-candidate:
    name: Full app over the compatibility bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightingale_ci
          POSTGRES_PASSWORD: nightingale_ci_password
          POSTGRES_DB: nightingale_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightingale_ci -d nightingale_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://nightingale_ci:nightingale_ci_password@127.0.0.1:5432/nightingale_ci
      DEMO_SEED_PASSWORD: synthetic-ci-seed-password
      SESSION_SECRET: synthetic-ci-session-secret-at-least-32-chars
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      LLM_PROVIDER: fixture
      VOICE_PROVIDER: disabled

    steps:
      - name: Check out deploy candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --requirement backend/requirements.lock

      - name: Upgrade fresh database through 0015
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check full ORM metadata drift
        working-directory: backend
        run: python -m alembic check

      - name: Exercise disposable 0015 downgrade and re-upgrade
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic downgrade 0014_patient_publications
          python -m alembic upgrade head
          python -m alembic check

      - name: Assert current schema head and compatibility default
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              inspector = inspect(engine)
              feedback_column = next(
                  column
                  for column in inspector.get_columns("highlight_feedback_events")
                  if column["name"] == "applied_to_profile"
              )
              assert feedback_column["nullable"] is False
              assert "true" in str(feedback_column["default"]).lower()
              with engine.connect() as connection:
                  assert (
                      connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
                      == "0015_feedback_backward_compat"
                  )
          finally:
              engine.dispose()
          PY

      - name: Run full synthetic seed twice
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/deploy-seed-first.json"
          second="${RUNNER_TEMP}/deploy-seed-second.json"
          python -m app.scripts.seed_demo > "${first}"
          python -m app.scripts.seed_demo > "${second}"
          python - "${first}" "${second}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as first_file:
              first = json.load(first_file)
          with open(sys.argv[2], encoding="utf-8") as second_file:
              second = json.load(second_file)
          assert first["counts"] == second["counts"]
          assert first["counts"]["patient_publications"] >= 1
          assert first["counts"]["patient_publication_evidence"] >= 1
          PY

      - name: Exercise baseline rollback compatibility
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          baseline_root="${RUNNER_TEMP}/nightingale-baseline"
          mkdir -p "${baseline_root}"
          git archive origin/main | tar -x -C "${baseline_root}"
          python -m app.scripts.round7_baseline_compat_probe "${baseline_root}"

      - name: Run full backend regression suite
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Run backend static quality gates
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check app tests
          python -m ruff format --check app tests
          python -m mypy app tests
          python -m pip check

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm install --frozen-lockfile

      - name: Run frontend lint and format checks
        working-directory: frontend
        run: |
          pnpm lint
          pnpm format:check

      - name: Run frontend tests and type-check
        working-directory: frontend
        run: |
          pnpm test
          pnpm type-check

      - name: Build frontend production bundle
        working-directory: frontend
        run: pnpm build

      - name: Build deploy candidate Docker image without pushing
        run: docker build --tag nightingale-real-clinic-deploy:${GITHUB_SHA} .
