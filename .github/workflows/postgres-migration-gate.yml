name: PostgreSQL migration gate

on:
  push:
    branches:
      - main
      - codex/postgres-migration-fix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-migrations:
    name: PostgreSQL 18 migrations and seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightingale_ci
          POSTGRES_PASSWORD: nightingale_ci_password
          POSTGRES_DB: nightingale_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightingale_ci -d nightingale_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nightingale_ci:nightingale_ci_password@127.0.0.1:5432/nightingale_ci
      DEMO_SEED_PASSWORD: synthetic-ci-seed-password
      APP_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend lock
        run: python -m pip install --requirement backend/requirements.lock

      - name: Upgrade the complete migration chain
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check the migrated schema against ORM metadata
        working-directory: backend
        run: python -m alembic check

      - name: Exercise the complete downgrade and re-upgrade path
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic downgrade 0001_gate_a
          python -m alembic upgrade head
          python -m alembic check

      - name: Inspect PostgreSQL schema and foreign keys
        working-directory: backend
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              inspector = inspect(engine)
              expected_tables = {
                  "clinics",
                  "users",
                  "clinic_memberships",
                  "patients",
                  "patient_user_links",
                  "entries",
                  "entry_versions",
                  "audit_logs",
                  "conflicts",
                  "comments",
                  "highlights",
                  "ai_processing_jobs",
                  "patient_glance_items",
                  "highlight_feedback_events",
                  "importance_profiles",
                  "archival_summaries",
                  "archival_summary_sources",
                  "mentions",
                  "tasks",
                  "task_conflicts",
                  "task_glance_items",
                  "collaboration_events",
                  "voice_sessions",
                  "transcript_segments",
              }
              actual_tables = set(inspector.get_table_names())
              missing_tables = expected_tables - actual_tables
              assert not missing_tables, sorted(missing_tables)

              entry_columns = {column["name"] for column in inspector.get_columns("entries")}
              assert {"occurred_at", "source_kind", "source_reference"} <= entry_columns
              comment_columns = {column["name"] for column in inspector.get_columns("comments")}
              assert {
                  "parent_comment_id",
                  "resolved_at",
                  "resolved_by_user_id",
                  "updated_at",
              } <= comment_columns
              foreign_keys = inspector.get_foreign_keys("comments")
              self_reference = [
                  foreign_key
                  for foreign_key in foreign_keys
                  if foreign_key["referred_table"] == "comments"
              ]
              assert any(
                  foreign_key["constrained_columns"] == ["parent_comment_id"]
                  and foreign_key["referred_columns"] == ["id"]
                  for foreign_key in self_reference
              )
              with engine.connect() as connection:
                  version_column = next(
                      column
                      for column in inspector.get_columns("alembic_version")
                      if column["name"] == "version_num"
                  )
                  assert (version_column["type"].length or 0) >= 64
                  assert (
                      connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
                      == "0010_postgres_compat"
                  )
          finally:
              engine.dispose()
          PY

      - name: Run synthetic seed twice and compare counts
        working-directory: backend
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/nightingale-seed-first.json"
          second="${RUNNER_TEMP}/nightingale-seed-second.json"
          python -m app.scripts.seed_demo > "${first}"
          python -m app.scripts.seed_demo > "${second}"
          python - "${first}" "${second}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as first_file:
              first = json.load(first_file)
          with open(sys.argv[2], encoding="utf-8") as second_file:
              second = json.load(second_file)
          assert first["counts"] == second["counts"]
          assert first["counts"]["highlights"] >= 5
          assert first["counts"]["glance_items"] == first["counts"]["highlights"]
          PY

      - name: Run the backend regression suite
        working-directory: backend
        run: python -m pytest
