services:
  - type: web
    name: nightingale-shared-care-note
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nightingale-shared-care-note-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://nightingale-shared-care-note.onrender.com
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DEMO_SEED_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: fixture
      - key: VOICE_PROVIDER
        value: fixture

databases:
  - name: nightingale-shared-care-note-db
    plan: free
    region: singapore
